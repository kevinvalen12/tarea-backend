spring.application.name=tareas
server.port=8081

# MongoDB: en local usa localhost; en Docker se sobreescribe con SPRING_MONGODB_URI del .env
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:tareas}

# JWT: default inofensivo para dev; en producción viene del .env
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-1234567890abcdefghij}
app.jwt.expiration=86400000