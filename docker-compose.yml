services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: ${URL_MONGO}
    depends_on:
      - mongo
    networks:
      - tareas-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USUARIO}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - tareas-net

  frontend:
    build: ../tarea-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - tareas-net

volumes:
  mongo-data:

networks:
  tareas-net:
