services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: ${URL_MONGO}
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - tareas-net

  mongo:
    image: mongo:7
    expose:
      - "27017"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USUARIO}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    networks:
      - tareas-net

  frontend:
    build: ../tarea-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    networks:
      - tareas-net

volumes:
  mongo-data:

networks:
  tareas-net:
