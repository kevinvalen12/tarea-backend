services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: 
    depends_on:
      - mongo
    networks:
      - tareas-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - tareas-net

volumes:
  mongo-data:

networks:
  tareas-net: